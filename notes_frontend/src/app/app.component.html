<div class="app-container">
  <header class="app-header">
    <div class="header-content">
      <h1>{{ title }}</h1>
      <nav class="main-nav">
        <a 
          routerLink="/notes" 
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{exact: true}"
        >All Notes</a>
        <a 
          routerLink="/notes/new" 
          routerLinkActive="active"
        >New Note</a>
        <a 
          routerLink="/search" 
          routerLinkActive="active"
        >Search</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
